spring:
  application:
    name: Garage QR codes database

  # Konfiguracja bazy danych
  datasource:
    driver-class-name: org.postgresql.Driver
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/garage_db}
    username: ${DATABASE_USERNAME:garage_user}
    password: ${DATABASE_PASSWORD:garage_pass}
    hikari:
      connection-timeout: 30000
      maximum-pool-size: 10

  jpa:
    database: postgresql
    hibernate:
      ddl-auto: ${DDL_AUTO:validate} # update tylko w dev
      naming:
        physical-strategy: org.hibernate.boot.model.naming.SnakeCasePhysicalNamingStrategy
    show-sql: ${SHOW_SQL:false}
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  # Konfiguracja plików
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  # Thymeleaf
  thymeleaf:
    cache: false # tylko w dev

# Swagger/OpenAPI
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method

# Konfiguracja QR
garage:
  qr:
    directory: ${QR_CODES_DIR:./QrCodes/}
    image-size: ${QR_IMAGE_SIZE:250}
    image-format: PNG

# Logowanie
logging:
  level:
    root: info
    com.garage.qr: debug
    org.hibernate.SQL: ${SHOW_SQL:false}
    org.hibernate.type.descriptor.sql.BasicBinder: ${SHOW_SQL:false}

# Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized
